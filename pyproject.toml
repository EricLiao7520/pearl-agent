[project]
name = "pearl-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "geopy>=2.5.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.31.0",
    "ipykernel>=7.3.0",
    "jaraco-context>=6.1.2",
    "jupyterlab>=4.6.3",
    "keyring>=25.7.0",
    "litellm>=1.101.0",
    "matplotlib>=3.11.2",
    "mcp>=2.2.0",
    "more-itertools>=11.1.0",
    "multidict>=6.8.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.5.3",
    "openai>=2.54.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sympy>=1.14.0",
    "tavily-python>=0.8.3",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
    "xmltodict>=1.0.4",
]

[project.scripts]
pearl-agent = "pearl_agent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
